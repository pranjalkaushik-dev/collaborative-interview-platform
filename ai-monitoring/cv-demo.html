<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>CV Proctoring Demo</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px;
        background: #f5f5f5;
      }

      .container {
        max-width: 1000px;
        margin: auto;
      }

      h1 {
        margin-bottom: 20px;
      }

      .main {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      video {
        width: 100%;
        max-width: 640px;
        border-radius: 8px;
        background: black;
      }

      .status {
        font-size: 24px;
        font-weight: bold;
        margin-top: 15px;
      }

      .face-count {
        margin-top: 8px;
      }

      button {
        padding: 10px 18px;
        margin-right: 10px;
        margin-top: 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      #start {
        background: #222;
        color: white;
      }

      #stop {
        background: #ddd;
      }

      .violations {
        max-height: 400px;
        overflow-y: auto;
      }

      .violation {
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 6px;
        background: #f8f8f8;
        border-left: 4px solid #d33;
      }

      .violation-type {
        font-weight: bold;
      }

      .violation-time {
        font-size: 12px;
        margin-top: 5px;
        color: #666;
      }

      .empty {
        color: #777;
      }

      @media (max-width: 800px) {
        .main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>CV Proctoring Demo</h1>

      <div class="main">
        <div class="card">
          <h2>Camera</h2>

          <video
            id="camera"
            autoplay
            muted
            playsinline
          ></video>

          <div class="status">
            Status:
            <span id="status">NOT_STARTED</span>
          </div>

          <p id="face-count">
            Faces detected: 0
          </p>

          <button id="start">
            Start Camera
          </button>

          <button id="stop">
            Stop Camera
          </button>
        </div>

        <div class="card">
          <h2>Violations</h2>

          <div
            id="violations"
            class="violations"
          >
            <p class="empty">
              No violations detected.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="./src/cv-proctoring/demo.ts"
    ></script>
  </body>
</html>
